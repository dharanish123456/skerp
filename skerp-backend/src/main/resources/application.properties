server.port=${SERVER_PORT:8087}

# spring.datasource.url=jdbc:postgresql://localhost:5432/skerp-backend
# spring.datasource.username=postgres
# spring.datasource.password=4658
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/skerp-backend}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:4658}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:uploads/employee-proofs}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://erp.skenterprises4u.com,https://erp.skenterprises4u.com}
app.attendance.zone=${ATTENDANCE_TIMEZONE:Asia/Kolkata}
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# JWT Configuration
jwt.secret=${JWT_SECRET:skerpLocalDevSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm2024}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
